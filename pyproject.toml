[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "source"
version = "0.1.0"
description = "Mensajería segura descentralizada (P08)"
requires-python = ">=3.10"
dependencies = [
    "ray[default]>=2.9",
    "pynacl>=1.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]

[tool.setuptools.packages.find]
include = ["source*"]

[tool.ruff]
# Versión mínima de Python que soporta tu proyecto
target-version = "py310"
# Longitud de línea máxima (88 es compatible con black)
line-length = 88
# Directorios a excluir del análisis
exclude = [".git", ".venv", "venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
# Conjuntos de reglas a activar
select = [
    "E",    # pycodestyle (errores de estilo)
    "W",    # pycodestyle (advertencias de estilo)
    "F",    # pyflakes (nombres no definidos, imports sin usar)
    "I",    # isort (orden de imports)
    "B",    # flake8-bugbear (errores comunes)
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade (sintaxis moderna de Python)
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (seguridad)
    "RUF",  # Reglas específicas de Ruff
]
# Reglas a ignorar globalmente
ignore = [
    "E501",  # Línea demasiado larga (lo maneja el formateador)
    "B008",  # Llamadas a funciones en argumentos por defecto
]

[tool.ruff.lint.per-file-ignores]
# Ignorar reglas específicas en tests
"tests/**/*.py" = ["S101", "S105", "S106", "S311"]

[tool.ruff.format]
# Estilo de comillas (doble comilla, compatible con black)
quote-style = "double"
# Estilo de indentación
indent-style = "space"

[tool.mypy]
python_version = "3.10"
# Activa el modo estricto: todas las comprobaciones de tipo posibles
strict = true
# Avisa si una función devuelve `Any` cuando se espera un tipo concreto
warn_return_any = true
# Avisa si un `# type: ignore` ya no es necesario
warn_unused_ignores = true
# Avisa sobre casts redundantes
warn_redundant_casts = true
# Muestra el código de error en los mensajes
show_error_codes = true
# Muestra el contexto del error
show_error_context = true
exclude = [".venv/", "venv/", "build/", "dist/"]

# Ejemplo: Ignorar la falta de stubs de tipos en librerías de terceros
[[tool.mypy.overrides]]
module = ["ray.*", "nacl.*"]
ignore_missing_imports = true

# Los tests usan pytest como dependencia de desarrollo opcional. Si no está
# instalado en el entorno que ejecuta `mypy .`, sus decoradores no deben
# producir errores de tipado secundarios.
[[tool.mypy.overrides]]
module = ["pytest", "pytest.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["misc", "arg-type"]

[[tool.mypy.overrides]]
module = ["hypothesis", "hypothesis.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "source"
include_external_packages = true
ignore_missing_imports = true

[[tool.importlinter.contracts]]
name = "Hexagonal architecture: layers"
type = "layers"
layers = [
    "source.adapters",
    "source.application",
    "source.domain",
]

[[tool.importlinter.contracts]]
name = "Domain must not import I/O libraries"
type = "forbidden"
source_modules = ["source.domain"]
forbidden_modules = ["ray", "sqlite3", "nacl", "os"]

# ─── Pytest ────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: pruebas que requieren Ray (lentas)",
    "contract: pruebas de contrato de puertos",
]

# ─── Coverage ──────────────────────────────────────────────────
[tool.coverage.run]
source = ["source"]
branch = true
omit = ["source/application/ports/*", "source/domain/node_id.py", "source/domain/records.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true