[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "source"
version = "0.1.0"
description = "Decentralized secure messaging (P08)"
requires-python = ">=3.10"
# EXACT versions (==): local environments, pre-commit and the CI use the same ones.
# To upgrade one: change the number here in a PR, check that the CI passes
# and, after the merge, reinstall with `pip install -e ".[dev]"`.
dependencies = [
    "ray[default]==2.59.0",
    "pynacl==1.6.2",
]

[project.optional-dependencies]
# Development tools: not needed to run the application.
dev = [
    "ruff==0.17.6",
    "mypy==2.4.1",
    "import-linter==2.15",
    "pre-commit==4.6.2",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "hypothesis==6.168.5",
]

[tool.setuptools.packages.find]
include = ["source*"]

# ─── Ruff: linter and formatter ───────────────────────────────
[tool.ruff]
target-version = "py310"  # rules and syntax of Python 3.10, the minimum version
line-length = 88          # line length applied by the formatter

[tool.ruff.lint]
select = [
    "E",    # pycodestyle: style errors
    "W",    # pycodestyle: style warnings
    "F",    # pyflakes: undefined names, unused imports and variables
    "I",    # isort: import order
    "B",    # flake8-bugbear: common bugs
    "C4",   # flake8-comprehensions: unnecessary comprehensions
    "UP",   # pyupgrade: modern Python syntax
    "SIM",  # flake8-simplify: simplifications
    "S",    # flake8-bandit: security
    "RUF",  # Ruff-specific rules (including flagging an unused `noqa`)
]
ignore = [
    # Line length is decided by the formatter. Lines it cannot split
    # (long strings, docstrings and comments) are not considered an error.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # `assert` is pytest's checking mechanism
    "S105",  # hardcoded passwords: they are test data
    "S311",  # `random` with a fixed seed, for deterministic tests (not cryptography)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── mypy: type checking ──────────────────────────────────────
[tool.mypy]
python_version = "3.10"
# `strict` turns on every optional check; among them,
# warn_return_any, warn_unused_ignores and warn_redundant_casts.
strict = true
show_error_context = true
exclude = [".venv/", "venv/", "build/", "dist/"]

# Tests break the types ON PURPOSE, to check that the code rejects at run
# time what static typing already forbids: arguments of the wrong type
# (arg-type), and modifying immutable objects or calling with arguments
# that are not allowed (misc).
[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["misc", "arg-type"]

# ─── import-linter: architecture rules ────────────────────────
[tool.importlinter]
root_package = "source"
include_external_packages = true  # required to forbid external packages
ignore_missing_imports = true

[[tool.importlinter.contracts]]
name = "Hexagonal architecture: layers"
type = "layers"
layers = [
    "source.adapters",
    "source.application",
    "source.domain",
]

[[tool.importlinter.contracts]]
name = "Domain must not import I/O libraries"
type = "forbidden"
source_modules = ["source.domain"]
forbidden_modules = ["ray", "sqlite3", "nacl", "os", "logging"]

# ─── pytest ───────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: tests that need Ray (slow)",
    "contract: port contract tests",
]

# ─── Coverage ─────────────────────────────────────────────────
[tool.coverage.run]
source = ["source"]  # only the application code (not tests/ nor tools/)
branch = true        # also measures both branches of every condition

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
# Only code that, by design, does not run in the tests is excluded.
# Files with logic are never excluded.
exclude_also = [
    'if __name__ == .__main__.:',  # program start-up; the tests call main()
    'if TYPE_CHECKING:',           # block only read by mypy
    'raise NotImplementedError',   # marker of pending or abstract code
    'class .*\bProtocol\):',       # interfaces: no behaviour of their own
]
