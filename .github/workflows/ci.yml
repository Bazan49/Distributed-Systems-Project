# .github/workflows/ci.yml
name: CI

# ¿Cuándo se ejecuta?
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Calidad de código y arquitectura
  quality:
    name: Lint, Types & Layering
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # O simplemente: pip install ruff mypy import-linter pytest

      - name: Ruff (Linter)
        run: ruff check .

      - name: Ruff (Formateador)
        run: ruff format --check .

      - name: Mypy (Tipos)
        run: mypy .

      - name: Import-linter (Capas)
        run: lint-imports

  # Job 2: Pruebas (se ejecuta en paralelo al anterior)
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ejecutar tests con cobertura
        run: pytest --cov=source --cov-report=term-missing --cov-fail-under=90