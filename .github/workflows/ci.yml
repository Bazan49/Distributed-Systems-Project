# Continuous integration: runs every quality check on a clean machine.
name: CI

# When it runs.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: code quality and architecture rules.
  quality:
    name: Lint, Types & Layering
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (linter)
        run: ruff check .

      - name: Ruff (formatter)
        run: ruff format --check .

      - name: Mypy (types)
        run: mypy .

      - name: Import-linter (layers)
        run: lint-imports

  # Job 2: tests, on every supported Python version (in parallel with job 1).
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the tests with coverage
        # The threshold (90 %) lives in pyproject.toml: [tool.coverage.report] fail_under.
        run: pytest --cov=source --cov-report=term-missing

      - name: Coverage of domain and application (plan minimum, 90 %)
        run: coverage report --include="source/domain/*,source/application/*" --fail-under=90
