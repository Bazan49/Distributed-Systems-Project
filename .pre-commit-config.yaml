# Automatic checks run on every `git commit`.
#
# Every hook uses the tools of the project's virtual environment
# (`language: system`), that is, EXACTLY the versions pinned in
# pyproject.toml, the same ones the CI uses. Therefore:
#   - commit with the .venv activated (`source .venv/bin/activate`);
#   - install once per clone:  pre-commit install
repos:
  - repo: local
    hooks:
      # Linter, on the Python files of the commit. It fixes what it can and
      # still stops the commit, so the changes are reviewed and added.
      - id: ruff-check
        name: ruff (linter)
        entry: ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]

      # Formatter, on Python and Markdown, like `ruff format --check .` in the CI.
      - id: ruff-format
        name: ruff (formatter)
        entry: ruff format
        language: system
        types_or: [python, pyi, markdown]

      # Types: on the WHOLE project, like the CI. A change in one file can
      # break the types of another, so the files of the commit are not enough.
      - id: mypy
        name: mypy (types)
        entry: mypy .
        language: system
        pass_filenames: false
        always_run: true

      # Hexagonal architecture rules:
      - id: import-linter
        name: import-linter (architecture)
        entry: lint-imports
        language: system
        pass_filenames: false
        always_run: true
